# ══════════════════════════════════════════════════════════════════
#  GitHub Pages —— 公开源码仓（Carson-Lianng/asset-snapshot）的官网上线流水线
#
#  ⚠ 这只在**公开仓**里生效。它由 app/tools/pack/pack-release.mjs 的 --public
#    档位从模板 `app/tools/pack/public-pages.yml` 归位到 `.github/workflows/`
#    —— 与那份 `.gitignore` 用的是同一条机制、同一个理由：
#    公开面只能由白名单生成，不能在公开仓里手改（改了下一次同步就没了）。
#
#  ⚠ 为什么 demo 在 CI 里现场构建、**不进 git**
#
#    官网的「在线试用」是 app/web 的一份只读演示构建。把它提交进仓库的话，
#    每次改前端都会产生一坨哈希命名的 JS/CSS 二进制 diff，把真实改动淹掉 ——
#    这与 `pack:public` 排除 `app/web/dist` 是同一条判据。
#    所以它只活在 runner 上：构建 → 拷进 site/demo/ → 直接进 Pages 产物。
#
#  ⚠ 为什么用 Actions 而不是「分支 /docs 目录」当发布源
#
#    分支目录源只能「原样发布一个目录」，做不到「发布前先构建」。
#    而 demo 必须构建 —— 所以只能走 Actions。
#
#  产物 URL：https://carson-lianng.github.io/asset-snapshot/
#  试用 URL：https://carson-lianng.github.io/asset-snapshot/try/
# ══════════════════════════════════════════════════════════════════

name: 官网发布（GitHub Pages）

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要这三个：读内容、写 Pages、用 OIDC 取部署令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一条发布；连着推两次时，旧的那条让位（否则两次部署会互相覆盖）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'      # 应用要求 ≥ 22.18（package.json 的 engines）
          cache: npm

      # `npm ci` 而非 `npm install`：构建要让前端产物可复现，锁文件必须被尊重
      - name: 安装依赖
        run: npm ci

      # 锁死离线数据源。不加这个变量，构建出来的产物会去打 /api —— 在
      # Pages 上没有服务端，demo 会白屏（而这一步不会失败，是静默的）。
      - name: 构建只读演示（离线源）
        run: npm run build
        env:
          VITE_DATA_SOURCE: fixture

      # 验收：离线构建的正面证据。少了 fixture.json 就是「构建成功但演示空白」，
      # 而这正是上面那条 env 掉了之后的表现 —— 必须在发布前拦住。
      - name: 校验演示产物
        run: |
          test -f app/web/dist/index.html || { echo "缺少 app/web/dist/index.html"; exit 1; }
          test -f app/web/dist/fixture.json || { echo "缺少 fixture.json —— 离线数据源没被带上"; exit 1; }
          echo "演示产物就绪：$(du -sh app/web/dist | cut -f1)"

      # demo 落进站点目录，只在 runner 上存在（.gitignore / pack:public 都排除它）
      - name: 组装站点
        run: |
          mkdir -p site/demo
          cp -R app/web/dist/. site/demo/
          echo "站点构成："
          find site -maxdepth 2 -not -path '*/demo/*' | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
