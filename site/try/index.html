<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在线试用 · 只读演示 —— 家底快照</title>
<meta name="description" content="家底快照的只读在线演示：22 个账户、7 期快照的示例数据。所有写操作按钮都是灰的，数据不会保存。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFE500">
<link rel="icon" type="image/svg+xml" href="../assets/logo-mark.svg">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body class="try-page">

<!-- ── 顶栏：只留「回去」与「源码」两个出口。锚点导航在这里没有意义 ── -->
<header class="tb">
  <div class="tb-in">
    <a class="tb-brand" href="../index.html">
      <img src="../assets/logo-mark.svg" width="34" height="34" alt="家底快照">
      <span class="tb-txt"><b>家底快照</b><i>记录你的净值轨迹</i></span>
    </a>
    <div class="tb-acts">
      <a class="btn pri sm" href="../index.html">← 回官网</a>
      <a class="btn ink sm" href="https://github.com/Carson-Lianng/asset-snapshot">★ GitHub</a>
    </div>
  </div>
</header>

<!-- ── 边界提示条：**常驻**（这是选「壳页 + 内嵌」而不是直接跳转的全部理由）。
        没有它，用户点「保存」失败会认为是 bug（PRD §6.3 方案 A）。── -->
<div class="try-bar">
  <span class="tag">只读演示</span>
  <p>下面是 22 个账户、7 期快照的<b>演示数据</b>。所有写操作按钮都是灰的 —— 它不会保存，也不会碰你的东西。想记自己的账，请下载到本机跑。</p>
  <a class="btn pri sm" href="../index.html#run">怎么跑起来 →</a>
</div>

<div class="try-frame">
  <iframe id="demoFrame" src="../demo/index.html?data=fixture"
          title="家底快照 · 只读演示" loading="eager"></iframe>
</div>

<div class="try-hint">
  演示里点「帮助」有完整使用手册 ·
  <a href="../demo/index.html?data=fixture" target="_blank" rel="noopener">在新标签里打开演示</a> ·
  <a href="../index.html#faq">常见问题</a>
</div>

<script>
/* 把本页的 hash 透传给 iframe。
   为什么需要这一段：手册与快照详情都是**参数化深链**（`#help?sec=concepts`），
   而 iframe 内外的 hash 互不连通 —— 官网上「读使用手册」指向 `/try/#help`，
   不转发的话用户只会看到一个停在首页的演示。

   为什么不用 assets/site.js：那一份是官网页的锚点高亮，与本页无关。
   这里只有 3 行，页内联比开一个只在单页用的文件更省事、也更少一次请求。 */
(function () {
  var f = document.getElementById('demoFrame');
  if (!f) return;
  var BASE = '../demo/index.html?data=fixture';
  function sync() {
    f.src = location.hash ? BASE + location.hash : BASE;
  }
  window.addEventListener('hashchange', sync);
  if (location.hash) sync();
})();
</script>

</body>
</html>
